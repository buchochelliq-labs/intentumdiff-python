name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-suite:
    name: Python full suite (${{ matrix.os }})
    # publish.yml builds wheels for ubuntu, macos, windows and windows-11-arm. Until now the
    # suite ran on windows-latest ONLY, so three of the four artefacts we publish had never
    # had a test run on the platform they target - compiled and uploaded on the strength of a
    # Windows run (#9).
    #
    # That is the 0.0.1 shape again: a check that proves the code builds standing in for a
    # check that proves the artefact works.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      # Never fail-fast. On the first run every platform's result is information we do not
      # have yet; cancelling macos because ubuntu went red would throw away half of it.
      fail-fast: false
      matrix:
        # Exactly the four publish.yml builds a wheel for, so no artefact ships from a
        # platform nothing was tested on. windows-11-arm is a NATIVE arm64 runner here for
        # the same reason it is in publish.yml: `-b cffi` makes maturin EXECUTE a
        # target-matching interpreter, and an arm64 python.exe cannot run on an x64 host.
        os: [windows-latest, ubuntu-latest, macos-latest, windows-11-arm]
    env:
      CARGO_PROFILE_DEV_DEBUG: "false"
      MATURIN_PEP517_ARGS: "--profile dev"
      # Empty on Dependabot PRs and fork PRs, which receive NO repository secrets.
      # Evaluated here because `secrets.*` cannot be referenced from a step-level `if:`.
      # Every open Dependabot PR in this repo was red purely because provisioning
      # hard-failed without it - nothing to do with the bumps they proposed.
      HAS_SPLIT_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN != '' }}
      # windows-11-arm died during collection with NO output at all: no traceback, no
      # "collected N items", just exit 1. That is what a native crash looks like when
      # stdout is still buffered - the buffer dies with the process and takes the only
      # evidence with it. These two make the next failure legible.
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: 1.95.0

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Phase D note: cross-repo checkout of the private intentumdiff-core needs an
      # org token (GITHUB_TOKEN is repo-scoped); until that secret is wired this
      # job documents the seam. Component staging additionally needs built parser
      # wasm (parser-repo artifacts / the registry-pinned set).
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        # windows-latest defaults to PowerShell; this step is POSIX shell.
        shell: bash
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Provision build inputs (engine + parser components)
        # Components come from the parser repos' CI artifacts, each verified against the
        # SHA-256 pinned in intentumdiff-registry (#95) — without them every language
        # resolves to 'unknown' and the suite cannot run. Fail-closed: a missing or
        # unverified component stops the job here rather than an hour later as mass
        # PluginNotFoundError failures.
        if: env.HAS_SPLIT_TOKEN == 'true'
        run: |
          pip install "pyyaml>=6.0"
          python scripts/provision_build_inputs.py --from-parser-artifacts
        env:
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}

      - name: Install intentumdiff + test dependencies
        # cffi first: the editable install is a maturin cffi-bindings build, which
        # requires the cffi module importable by the TARGET interpreter at build time.
        run: |
          python -m pip install --upgrade pip
          pip install cffi
          pip install -e .[dev,serve]

      - name: Run the full unit suite
        if: env.HAS_SPLIT_TOKEN == 'true'
        run: python -m pytest tests/unit -q
        env:
          # Components were just staged, so an incomplete set is a provisioning failure, not
          # a reason to quietly cover less. Without this the suite ran with ZERO renderers
          # loaded and still reported green (#22).
          INTENTUMDIFF_REQUIRE_ALL_COMPONENTS: "1"

      - name: Run the reduced suite (no token - components unavailable)
        # Dependabot and fork PRs get no secrets, so parser components cannot be
        # provisioned and every component-dependent test would fail for a reason the author
        # cannot fix. Run what CAN run, and SAY what was skipped - a quiet reduced gate is
        # indistinguishable from a full one, and someone will eventually merge believing the
        # whole suite ran.
        #
        # The full gate still runs on every maintainer branch PR and on the base branch, so
        # nothing merges without it having passed somewhere.
        if: env.HAS_SPLIT_TOKEN != 'true'
        run: |
          echo "::notice::SPLIT_REPO_TOKEN unavailable (Dependabot or fork PR) - parser components were not provisioned, so component-dependent tests are skipped. A maintainer run exercises the full gate."
          python -m pytest tests/unit -q --deselect tests/unit/test_construct_edit_matrix.py

      - name: Build a wheel on this platform
        # The suite above runs against an EDITABLE install, which resolves imports from the
        # source checkout. That is not the artefact anyone downloads. Every 0.0.1 defect
        # survived a green suite and appeared the moment a real wheel was installed, so the
        # wheel itself has to be built and exercised here.
        if: env.HAS_SPLIT_TOKEN == 'true'
        run: pip wheel . --no-deps --wheel-dir dist

      - name: Smoke the wheel this platform just built
        # Installs into a CLEAN venv and does what a user does in their first five minutes:
        # import, console script, python -m, a real diff, clean stderr, and every URL in the
        # output resolving. Against the wheel built on THIS runner, not a source checkout and
        # not the wheel some other platform produced.
        if: env.HAS_SPLIT_TOKEN == 'true'
        shell: bash
        run: |
          wheel=$(ls dist/*.whl | head -1)
          echo "smoking $wheel on $RUNNER_OS"
          python scripts/smoke_published_wheel.py --wheel "$wheel"

  action-pins:
    name: Pins and links we ship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every pinned SHA against its version comment
        # Reads only PUBLIC tag lists, so GITHUB_TOKEN is enough and this job works on
        # Dependabot and fork PRs, which receive no repository secrets. That matters: a
        # wrong comment is precisely what makes Dependabot open bumps that are already
        # applied, so the check has to run on the PRs where the symptom shows up.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_action_pin_comments.py

      - name: Check every URL we ship actually resolves
        # 0.0.1 shipped an error message naming a domain that was never registered, and its
        # replacement named a file that does not exist on main. Both were introduced AS fixes.
        #
        # smoke_published_wheel.py already checks URLs that appear on stderr, but it can only
        # see what a successful run prints - and the plugin-metadata error fires only for a
        # third-party plugin, so its dead link went unnoticed through two releases.
        #
        # Needs no secrets, so this runs on Dependabot and fork PRs too.
        run: python scripts/check_source_urls.py
