name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-suite:
    name: Python full suite (pytest)
    # windows-latest matches the environment the suite is developed and gated on
    # (named-pipe LiveServer tests, path handling).
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: "false"
      MATURIN_PEP517_ARGS: "--profile dev"
      # Empty on Dependabot PRs and fork PRs, which receive NO repository secrets.
      # Evaluated here because `secrets.*` cannot be referenced from a step-level `if:`.
      # Every open Dependabot PR in this repo was red purely because provisioning
      # hard-failed without it - nothing to do with the bumps they proposed.
      HAS_SPLIT_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0

      - name: Install Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      # Phase D note: cross-repo checkout of the private intentumdiff-core needs an
      # org token (GITHUB_TOKEN is repo-scoped); until that secret is wired this
      # job documents the seam. Component staging additionally needs built parser
      # wasm (parser-repo artifacts / the registry-pinned set).
      - name: Authenticate cross-repo git deps
        # Private sibling repos (the SDK / the engine) are git dependencies. GITHUB_TOKEN is
        # scoped to THIS repo only, so cargo/pip cannot fetch them without an org-scoped
        # token. Set the SPLIT_REPO_TOKEN secret (PAT or App token with read access to the
        # buchochelliq-labs repos); without it this step warns and the build fails clearly.
        # windows-latest defaults to PowerShell; this step is POSIX shell.
        shell: bash
        env:
          SPLIT_REPO_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}
        run: |
          if [ -n "$SPLIT_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${SPLIT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "cross-repo git auth configured"
          else
            echo "::warning::SPLIT_REPO_TOKEN not set - private cross-repo dependencies will fail to fetch"
          fi

      - name: Provision build inputs (engine + parser components)
        # Components come from the parser repos' CI artifacts, each verified against the
        # SHA-256 pinned in intentumdiff-registry (#95) — without them every language
        # resolves to 'unknown' and the suite cannot run. Fail-closed: a missing or
        # unverified component stops the job here rather than an hour later as mass
        # PluginNotFoundError failures.
        if: env.HAS_SPLIT_TOKEN == 'true'
        run: |
          pip install "pyyaml>=6.0"
          python scripts/provision_build_inputs.py --from-parser-artifacts
        env:
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN }}

      - name: Install intentumdiff + test dependencies
        # cffi first: the editable install is a maturin cffi-bindings build, which
        # requires the cffi module importable by the TARGET interpreter at build time.
        run: |
          python -m pip install --upgrade pip
          pip install cffi
          pip install -e .[dev,serve]

      - name: Run the full unit suite
        if: env.HAS_SPLIT_TOKEN == 'true'
        run: python -m pytest tests/unit -q

      - name: Run the reduced suite (no token - components unavailable)
        # Dependabot and fork PRs get no secrets, so parser components cannot be
        # provisioned and every component-dependent test would fail for a reason the author
        # cannot fix. Run what CAN run, and SAY what was skipped - a quiet reduced gate is
        # indistinguishable from a full one, and someone will eventually merge believing the
        # whole suite ran.
        #
        # The full gate still runs on every maintainer branch PR and on the base branch, so
        # nothing merges without it having passed somewhere.
        if: env.HAS_SPLIT_TOKEN != 'true'
        run: |
          echo "::notice::SPLIT_REPO_TOKEN unavailable (Dependabot or fork PR) - parser components were not provisioned, so component-dependent tests are skipped. A maintainer run exercises the full gate."
          python -m pytest tests/unit -q --deselect tests/unit/test_construct_edit_matrix.py
