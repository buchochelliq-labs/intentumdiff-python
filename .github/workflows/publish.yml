name: Promote independently reviewed platform wheels
# No wheel is rebuilt, repaired, or retagged in the publication workflow.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify immutable wheels without publishing"
        type: boolean
        default: true
      publish_testpypi:
        description: "Explicit TestPyPI upload of reviewed wheels (requires dry_run=false)"
        type: boolean
        default: false
      candidate_run_id:
        description: "Successful release-branch CI run ID"
        type: string
      candidate_source_sha:
        description: "40-character tested Python Git SHA"
        type: string
      candidate_core_sha:
        description: "40-character tested Rust Core SHA"
        type: string
      candidate_wheels_json:
        description: 'JSON: four runner names mapped to {"id":artifact_ID,"sha256":wheel_SHA256}'
        type: string

permissions: {}
jobs:
  promote:
    name: Verify and retain exact reviewed PyPI wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_RUN_ID: ${{ inputs.candidate_run_id || vars.INTENTUMDIFF_PYPI_RUN_ID }}
      REVIEWED_SOURCE_SHA: ${{ inputs.candidate_source_sha || vars.INTENTUMDIFF_PYPI_SOURCE_SHA }}
      REVIEWED_CORE_SHA: ${{ inputs.candidate_core_sha || vars.INTENTUMDIFF_PYPI_CORE_SHA }}
      REVIEWED_WHEELS_JSON: ${{ inputs.candidate_wheels_json || vars.INTENTUMDIFF_PYPI_WHEELS_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches the version of reviewed source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag=$(printf '%s' "$GIT_TAG" | cut -c2-)
          [ "$tag" = "$declared" ] || { echo "::error::tag/version mismatch" >&2; exit 1; }
      - name: Verify source tree, successful four-platform CI and exact artifact IDs
        id: candidate
        run: python scripts/promote_reviewed_wheels.py metadata
      - name: Download only four approved CI artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_ids }}
          run-id: ${{ env.REVIEWED_RUN_ID }}
          github-token: ${{ github.token }}
          path: reviewed-dist/
          merge-multiple: false
      - name: Verify source, Core, release profile, per-platform hashes and PyPI tags
        run: |
          python scripts/promote_reviewed_wheels.py wheels
          python scripts/verify_intentumdiff_wheel.py publish-dist \
            --max-wheel-mb 75 --max-release-mb 250 \
            --expected-name intentumdiff-python \
            --expected-version "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" \
            --expected-platform-pattern ".*manylinux.*x86_64.*" \
            --expected-platform-pattern "macosx_.*" \
            --expected-platform-pattern "win_amd64" \
            --expected-platform-pattern "win_arm64"
          sha256sum --check reviewed-wheels.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-pypi-wheels
          path: |
            publish-dist/*.whl
            reviewed-wheels.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Record promotion provenance
        shell: bash
        run: |
          {
            echo "### Reviewed, immutable wheels (not rebuilt)"
            echo ""
            echo "Source: $REVIEWED_SOURCE_SHA"
            echo "Core: $REVIEWED_CORE_SHA"
            echo "CI run: $REVIEWED_RUN_ID"
            echo ""
            cat reviewed-wheels.sha256
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: Publish approved wheels to PyPI
    needs: promote
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/intentumdiff-python
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-pypi-wheels
          path: ./
      - name: Reverify immutable bytes in publish job
        run: sha256sum --check reviewed-wheels.sha256
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          attestations: false
  publish-testpypi:
    name: Explicitly publish reviewed bytes to TestPyPI
    needs: promote
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/intentumdiff-python/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-pypi-wheels
          path: ./
      - name: Reverify immutable bytes in TestPyPI job
        run: sha256sum --check reviewed-wheels.sha256
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          repository-url: https://test.pypi.org/legacy/
          attestations: false
