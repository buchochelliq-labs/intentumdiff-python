<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntentDiff Playground</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0b0f14;
  color: #e6edf3;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  padding: 10px 18px;
  background: #121820;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 600; color: #f0f6fc; }
header a  { font-size: 12px; color: #58a6ff; text-decoration: none; }
header a:hover { text-decoration: underline; }

.editors {
  display: flex;
  flex: 1;
  min-height: 0;
  border-bottom: 1px solid #30363d;
  background: #0d1117;
}
.pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.pane + .pane { border-left: 1px solid #30363d; }
.pane-label {
  padding: 7px 12px;
  background: #121820;
  font-size: 11px;
  font-weight: 600;
  color: #8b949e;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  flex-shrink: 0;
  border-bottom: 1px solid #30363d;
}
.editor-wrap { flex: 1; min-height: 0; position: relative; }

.toolbar {
  padding: 8px 14px;
  background: #121820;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  gap: 8px 12px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.toolbar label { font-size: 13px; color: #8b949e; }
#lang-select,
#plugin-select {
  background: #21262d;
  border: 1px solid #30363d;
  color: #e6edf3;
  height: 30px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
#lang-select {
  min-width: 150px;
}
#plugin-select {
  max-width: 320px;
}
#compare-btn {
  height: 30px;
  padding: 4px 18px;
  background: #238636;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
#compare-btn:hover:not(:disabled) { background: #2ea043; }
#compare-btn:disabled { background: #1a4a25; color: #555; cursor: default; }
#spinner { display: none; font-size: 12px; color: #8b949e; }
#detected-lang { font-size: 12px; color: #8b949e; }
#detected-lang strong { color: #3fb950; }

.fallback-editor {
  width: 100%;
  height: 100%;
  resize: none;
  border: 0;
  outline: none;
  padding: 12px;
  background: #0d1117;
  color: #e6edf3;
  font-family: 'SFMono-Regular', Consolas, monospace;
  font-size: 13px;
  line-height: 1.45;
}

/* Results bar */
.results-bar {
  padding: 6px 14px;
  background: #121820;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#results-toggle {
  font-size: 12px;
  color: #8b949e;
  cursor: pointer;
  user-select: none;
  padding: 2px 6px;
  border-radius: 4px;
}
#results-toggle:hover { color: #e6edf3; background: #21262d; }
.results.collapsed { height: 0 !important; padding: 0 !important; overflow: hidden; border: none; }

.results {
  height: min(34vh, 280px);
  min-height: 180px;
  overflow-y: auto;
  padding: 12px 14px 16px;
  flex-shrink: 0;
  background: #0d1117;
}

.results-empty { color: #8b949e; font-size: 13px; font-style: italic; }

.summary {
  font-size: 13px;
  color: #8b949e;
  margin-bottom: 10px;
  line-height: 1.35;
}
.summary strong { color: #e6edf3; }

.change-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }

.change-item {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 11px;
  background: #141a21;
  border: 1px solid #21262d;
  border-radius: 7px;
  border-left: 3px solid transparent;
  font-size: 13px;
}
.change-item[data-idx] { cursor: pointer; }
.change-item[data-idx]:hover { background: #18212b; border-color: #30363d; }
.change-item.ci-ADDITION    { border-left-color: #3fb950; }
.change-item.ci-DELETION    { border-left-color: #f85149; }
.change-item.ci-MODIFICATION{ border-left-color: #e3b341; }
.change-item.ci-MOVE        { border-left-color: #58a6ff; }
.change-item.ci-STYLE_ONLY  { border-left-color: #484f58; }
.change-item.ci-REFACTORING { border-left-color: #bc8cff; }
.change-item.ci-MOVE_TO_MODULE    { border-left-color: #39d353; }
.change-item.ci-CROSS_FILE_RENAME { border-left-color: #ffa657; }
.change-item.ci-REORDER     { border-left-color: #388bfd; }

.badge {
  display: inline-block;
  min-width: 82px;
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0;
  text-align: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.badge-ADDITION    { background: #1a4a25; color: #3fb950; }
.badge-DELETION    { background: #4a1a1a; color: #f85149; }
.badge-MODIFICATION{ background: #3a2e00; color: #e3b341; }
.badge-MOVE        { background: #0c2d6b; color: #58a6ff; }
.badge-STYLE_ONLY  { background: #1c1c1c; color: #8b949e; }
.badge-REFACTORING { background: #2d1a4a; color: #bc8cff; }
.badge-MOVE_TO_MODULE    { background: #0d2e2d; color: #39d353; }
.badge-CROSS_FILE_RENAME { background: #3a1e00; color: #ffa657; }
.badge-REORDER     { background: #1a2040; color: #79c0ff; }

.change-detail { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.change-label  { font-weight: 600; color: #f0f6fc; word-break: break-word; }
.change-desc   { color: #9aa7b4; font-size: 12px; line-height: 1.35; }
.change-meta   { color: #6e7681; font-size: 11px; line-height: 1.35; }

.parse-error {
  padding: 7px 10px;
  background: #3a1a00;
  border-left: 3px solid #d29922;
  border-radius: 6px;
  font-size: 12px;
  color: #e3b341;
  margin-bottom: 6px;
}

.error-msg {
  color: #f85149;
  font-size: 13px;
  padding: 8px 10px;
  background: #2d1010;
  border-radius: 6px;
  border-left: 3px solid #f85149;
}

details.json-toggle {
  margin-top: 8px;
  border: 1px solid #30363d;
  border-radius: 6px;
  overflow: hidden;
}
details.json-toggle summary {
  padding: 5px 10px;
  background: #161b22;
  cursor: pointer;
  font-size: 12px;
  color: #8b949e;
  user-select: none;
  list-style: none;
}
details.json-toggle summary::before { content: '\25b6  '; font-size: 10px; }
details.json-toggle[open] summary::before { content: '\25bc  '; }
details.json-toggle pre {
  padding: 10px;
  font-size: 11px;
  color: #8b949e;
  overflow: auto;
  max-height: 280px;
  background: #0d1117;
  font-family: 'SFMono-Regular', Consolas, monospace;
}

/* Monaco decoration overlays */
.dec-ADDITION     { background: rgba(63,185,80,0.15); }
.dec-DELETION     { background: rgba(248,81,73,0.15); }
.dec-MODIFICATION { background: rgba(227,179,65,0.15); }
.dec-MOVE         { background: rgba(88,166,255,0.15); }
.dec-STYLE_ONLY   { background: rgba(72,79,88,0.15); }
.dec-REFACTORING  { background: rgba(188,140,255,0.15); }
.dec-MOVE_TO_MODULE    { background: rgba(57,211,83,0.15); }
.dec-CROSS_FILE_RENAME { background: rgba(255,166,87,0.15); }
.dec-REORDER      { background: rgba(56,139,253,0.15); }
.dec-ADDITION-glyph    { border-left: 3px solid #3fb950; }
.dec-DELETION-glyph    { border-left: 3px solid #f85149; }
.dec-MODIFICATION-glyph{ border-left: 3px solid #e3b341; }
.dec-MOVE-glyph        { border-left: 3px solid #58a6ff; }
.dec-STYLE_ONLY-glyph  { border-left: 3px solid #484f58; }
.dec-REFACTORING-glyph { border-left: 3px solid #bc8cff; }
.dec-MOVE_TO_MODULE-glyph    { border-left: 3px solid #39d353; }
.dec-CROSS_FILE_RENAME-glyph { border-left: 3px solid #ffa657; }
.dec-REORDER-glyph     { border-left: 3px solid #388bfd; }
</style>
</head>
<body>

<header>
  <h1>IntentDiff Playground</h1>
  <a href="/api/docs" target="_blank">API docs</a>
</header>

<div class="editors">
  <div class="pane">
    <div class="pane-label">Old code</div>
    <div class="editor-wrap" id="old-wrap"></div>
  </div>
  <div class="pane">
    <div class="pane-label">New code</div>
    <div class="editor-wrap" id="new-wrap"></div>
  </div>
</div>

<div class="toolbar">
  <label for="lang-select">Language</label>
  <select id="lang-select">
    <option value="">Auto-detect</option>
  </select>
  <label id="plugin-label" for="plugin-select" style="display:none">Plugin</label>
  <select id="plugin-select" style="display:none"></select>
  <button id="compare-btn">Compare &#9654;</button>
  <span id="spinner">Computing...</span>
  <span id="detected-lang" style="display:none">Detected: <strong id="detected-lang-name"></strong></span>
</div>

<div class="results-bar">
  <span id="results-toggle">Changes &#9662;</span>
</div>

<div class="results" id="results">
  <p class="results-empty">Paste code into the editors above, then click Compare.</p>
</div>

<!-- Monaco is served from the vendored local copy.
     Run "python scripts/vendor_monaco.py" to populate /static/vendor/.
     For development without vendoring, replace the src below with:
       https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js
     NOTE: CDN usage violates the Content-Security-Policy in production. -->
<script src="/static/vendor/min/vs/loader.js"></script>
<script src="/static/playground.js"></script>
</body>
</html>
