# Diff-analyzer plugins post-process the classified SemanticDiff and can
# add or modify Change objects with language-specific change_type strings.
# Third-party packages register here via:
#   [project.entry-points."intentumdiff.diff_analyzers"]
#   my-lang = "my_lang_plugin:diff_analyzer_wasm_path"

# ── Maturin native wheel config ──────────────────────────────────────────────
# IntentumDiff is shipped as one native platform wheel. The wheel contains:
# - the Python public API/CLI packages from src/
# - pre-built first-party Wasm parser/renderer components
# - the PyO3 Rust core host extension module
#
# Do NOT publish an sdist for the first public release. Installing from source
# requires Rust, maturin, and the wasm32-wasip2 target, which is the opposite of
# the intended user experience. Use .github/workflows/publish.yml to build
# pre-compiled platform wheels.

[tool.maturin]
# The engine lives in intentumdiff-core (#82 split) — this repo is the THIN Python binding.
# `python scripts/provision_build_inputs.py` stages a pinned checkout of intentumdiff-core at
# build/intentumdiff-core (and the built parser components into src/intentumdiff/wasm) before any
# wheel build; the monorepo remains the archive of record.
manifest-path = "build/intentumdiff-core/crates/rust-core-host/Cargo.toml"
python-source = "src"
module-name = "intentumdiff.intentumdiff_rust_core"
python-packages = ["intentumdiff"]
# The crate is PyO3-free (#82/B.6): both `maturin develop` and the release wheel build a bare cdylib
# (`intentumdiff/intentumdiff_rust_core/intentumdiff_rust_core.<ext>`) that `rust_core.py` loads via ctypes
# over the C ABI. `bindings = "cffi"` builds + packages that cdylib (maturin embeds cbindgen; its
# generated cffi wrapper is unused — the loader ctypes-loads the cdylib directly, so no cffi runtime
# dep). Release: `maturin build --release -b cffi --compatibility pypi`.
bindings = "cffi"
include = [
    { path = "src/intentumdiff/wasm/*.wasm", format = "wheel" },
    { path = "src/intentumdiff/invariances/*.yaml", format = "wheel" },
    { path = "src/intentumdiff/invariances/*.json", format = "wheel" },
    # The published plugin-registry schema (#95) — loaded at runtime via resources.files.
    { path = "src/intentdiff/plugins/*.json", format = "wheel" },
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# A generous per-test timeout is a HARD safety net: no single test may ever stall the suite for
# hours (the #73 named-pipe hang cost a ~2h wall block). `thread` is the only method that works on
# Windows. 600s is far above any real unit test, so it only ever catches a genuine hang/deadlock.
addopts = ["-m", "not benchmark", "--timeout=600", "--timeout-method=thread"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)-8s %(name)s: %(message)s"
markers = [
    "security: adversarial sandbox tests",
    "integration: requires git binary and fixture repo",
    "snapshot: renderer snapshot tests",
    "browser: optional Playwright browser smoke tests",
    "benchmark: performance + opt-in real-LLM accuracy benchmarks (need a key/network) excluded from default pytest runs",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/intentumdiff"]
omit = ["*/wasm/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[dependency-groups]
dev = [
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.3",
]
