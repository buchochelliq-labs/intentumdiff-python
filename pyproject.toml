[build-system]
# >=1.14: the pyo3-free cffi build (#B.6) runs cbindgen, which maturin only *embeds* from 1.14
# (publish.yml pins 1.14.1). `pip install -e .` reads this, so a pre-1.14 resolver would fail the
# cffi cdylib build with "cbindgen not found".
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
# DELIBERATE, not a fallback: this is the Python BINDING of a polyglot core, and it is
# named for that role alongside its siblings (intentumdiff-go, intentumdiff-java, ...) per
# docs/TARGET_ARCHITECTURE.md. Do NOT "fix" this back to a bare `intentumdiff` if that PyPI
# name ever frees up - the per-language suffix is the convention, and renaming a published
# distribution costs users an uninstall/reinstall for no benefit.
# Distribution name only: the import is unchanged, `import intentumdiff`.
name = "intentumdiff-python"
version = "0.0.1"
description = "Semantic code review: detect intent, moves, refactorings, and style changes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["diff", "semantic", "ast", "refactoring", "code-analysis"]
authors = [{ name = "BuchochelliQ Labs" }]
maintainers = [{ name = "BuchochelliQ Labs" }]

dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "rich>=13.0",
    "rich-click>=1.8",
    "unidiff>=0.7",
    "pygments>=2.17",
    "pyyaml>=6.0",
    "wasmtime>=47.0.1",
    "defusedxml>=0.7",
    "pathspec>=0.12",
    "watchdog>=3.0",
]

[project.urls]
Homepage = "https://github.com/buchochelliq-labs/intentumdiff"
Repository = "https://github.com/buchochelliq-labs/intentumdiff"
Issues = "https://github.com/buchochelliq-labs/intentumdiff/issues"
Documentation = "https://github.com/buchochelliq-labs/intentumdiff/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-snapshot",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.3",
    "coverage>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=4.0",
    "hypothesis>=6.100",
    "pydantic[mypy]",
    "httpx>=0.27",
    # Test-harness only — the product shells to the git CLI, not GitPython (#98, A2.4).
    "gitpython>=3.1.57",
    # Optional-feature packages required to run the full test suite
    "lsprotocol>=2023.0",
    "pygls>=1.3",
    "duckdb>=0.10",
    "numpy>=1.26",
    "pandas>=2.0",
]
analytics = [
    "duckdb>=0.10",
    "numpy>=1.26",
    "pandas>=2.0",
]
lsp = [
    "lsprotocol>=2023.0",
]
lsp-server = [
    "pygls>=1.3",
]
serve = [
    "fastapi>=0.110",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.29",
]
# Mercurial support needs only the `hg` CLI on PATH — the Rust core shells it directly
# (#98, A2.4.4); python-hglib is no longer used. The extra is kept as a no-op so existing
# `pip install "intentumdiff[hg]"` invocations still resolve.
hg = []
# Perforce support needs only the `p4` CLI on PATH — the Rust core shells it directly
# (#98, A2.4.4); p4python is no longer used. The extra is kept as a no-op so existing
# `pip install "intentumdiff[perforce]"` invocations still resolve.
perforce = []

[project.scripts]
intentumdiff = "intentumdiff.cli:main"

